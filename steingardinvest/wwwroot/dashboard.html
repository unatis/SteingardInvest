<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Steingard Invest</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Dashboard Header -->
    <header class="dashboard-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-text">Steingard<span class="logo-accent">Invest</span></span>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" title="Notifications">
                        <span>🔔</span>
                    </button>
                    <button class="btn-icon" title="Profile">
                        <span>👤</span>
                    </button>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Search and Filters Section -->
    <section class="search-section">
        <div class="container">
            <div class="search-container">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search properties by location, type, or name..." class="search-input">
                    <button class="search-btn" onclick="performSearch()">🔍</button>
                </div>
                <button class="btn-filter-toggle" onclick="toggleFilters()">
                    <span>⚙️</span> Filters
                </button>
            </div>
            
            <!-- Filters Panel -->
            <div id="filtersPanel" class="filters-panel">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label>Property Type</label>
                        <select id="filterType" class="filter-select">
                            <option value="">All Types</option>
                            <option value="apartment">Apartment</option>
                            <option value="house">House</option>
                            <option value="commercial">Commercial</option>
                            <option value="land">Land</option>
                            <option value="villa">Villa</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Location</label>
                        <select id="filterLocation" class="filter-select">
                            <option value="">All Locations</option>
                            <option value="new-york">New York</option>
                            <option value="los-angeles">Los Angeles</option>
                            <option value="miami">Miami</option>
                            <option value="chicago">Chicago</option>
                            <option value="london">London</option>
                            <option value="paris">Paris</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Price Range</label>
                        <div class="price-range">
                            <input type="number" id="priceMin" placeholder="Min" class="price-input">
                            <span>-</span>
                            <input type="number" id="priceMax" placeholder="Max" class="price-input">
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>Bedrooms</label>
                        <select id="filterBedrooms" class="filter-select">
                            <option value="">Any</option>
                            <option value="1">1+</option>
                            <option value="2">2+</option>
                            <option value="3">3+</option>
                            <option value="4">4+</option>
                            <option value="5">5+</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Sort By</label>
                        <select id="sortBy" class="filter-select">
                            <option value="price-asc">Price: Low to High</option>
                            <option value="price-desc">Price: High to Low</option>
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                        </select>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
                        <button class="btn btn-secondary" onclick="clearFilters()">Clear</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Properties Catalog -->
    <main class="dashboard-main">
        <div class="container">
            <div class="catalog-header">
                <h1>Real Estate Catalog</h1>
                <div class="results-info">
                    <span id="resultsCount">0</span> properties found
                </div>
            </div>
            
            <div id="propertiesGrid" class="properties-grid">
                <!-- Properties will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Property Detail Modal -->
    <div id="propertyModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="closePropertyModal()">&times;</span>
            <div id="propertyDetails" class="property-details">
                <!-- Property details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
